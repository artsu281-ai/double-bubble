name: DoubleBubble
options:
  bundleIdPrefix: com.doublebubble
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "2.0.9"
    CURRENT_PROJECT_VERSION: "13"
    PRODUCT_NAME: "Double Bubble"

targets:
  DoubleBubble:
    type: application
    platform: macOS
    sources:
      - path: DoubleBubble
    info:
      path: DoubleBubble/Info.plist
      properties:
        CFBundleName: Double Bubble
        CFBundleDisplayName: Double Bubble
        CFBundleIdentifier: com.doublebubble.app
        CFBundleVersion: "13"
        CFBundleShortVersionString: "2.0.9"
        # Shown in the standard About window and in Finder's Get Info.
        NSHumanReadableCopyright: "© 2026 ConstantaAI"
        CFBundleLocalizations: [en, ru]
        CFBundleDevelopmentRegion: en
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        # Entitlements for security-scoped bookmarks
        com.apple.security.app-sandbox: false
    entitlements:
      path: DoubleBubble/DoubleBubble.entitlements
    settings:
      base:
        # Pinned, because it stopped being pinned by accident. Defining a
        # scheme for the test target made Release build universal (x86_64 and
        # arm64) and doubled the binary, 5.7 MB to 14.9 — a change to what gets
        # distributed, arriving as a side effect of adding tests rather than as
        # a decision anyone made. Every release so far has been arm64 only.
        # Shipping Intel too is a one-line change: "$(ARCHS_STANDARD)".
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: com.doublebubble.app
        INFOPLIST_FILE: DoubleBubble/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DoubleBubbleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DoubleBubble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doublebubble.tests
        PRODUCT_NAME: DoubleBubbleTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        # The host is named "Double Bubble", not after its target, so the
        # default XcodeGen derives from the target name points at nothing.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Double Bubble.app/Contents/MacOS/Double Bubble"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DoubleBubble:
    build:
      targets:
        DoubleBubble: all
        DoubleBubbleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DoubleBubbleTests
    archive:
      config: Release
