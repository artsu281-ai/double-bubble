name: DoubleBubble
options:
  bundleIdPrefix: com.doublebubble
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_NAME: "Double Bubble"

targets:
  DoubleBubble:
    type: application
    platform: macOS
    sources:
      - path: DoubleBubble
    info:
      path: DoubleBubble/Info.plist
      properties:
        CFBundleName: Double Bubble
        CFBundleDisplayName: Double Bubble
        CFBundleIdentifier: com.doublebubble.app
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.0.1"
        # Shown in the standard About window and in Finder's Get Info.
        NSHumanReadableCopyright: "© 2026 ConstantaAI"
        CFBundleLocalizations: [en, ru]
        CFBundleDevelopmentRegion: en
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        # Entitlements for security-scoped bookmarks
        com.apple.security.app-sandbox: false
    entitlements:
      path: DoubleBubble/DoubleBubble.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doublebubble.app
        INFOPLIST_FILE: DoubleBubble/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
